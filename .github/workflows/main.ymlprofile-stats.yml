name: Generate Profile Stats SVG
on:
  workflow_dispatch:   # 支持手动点击运行
  schedule:
    - cron: '0 */8 * * *' # 每8小时更新一次，可修改

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. github‑readme‑stats：stats + top‑langs
      - name: Generate github‑readme‑stats
        uses: stats-organization/github-readme-stats-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_dir: ./.github/generated
          stats_options: >
            username=MinjieY
            theme=transparent
            hide_border=true
            show_icons=true
            include_all_commits=true
          top_langs_options: >
            username=MinjieY
            hide_title=true
            hide_border=true
            layout=compact
            langs_count=6
            text_color=000
            icon_color=fff
            bg_color=0,52fa5a,4dfcff,c64dff
            theme=graywhite

      # 2. activity‑graph
      - name: Generate activity‑graph
        uses: jparruda/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: ./.github/generated/activity-graph.svg
          config: |
            activity_graph:
              area: true
              hide_border: true
              theme: github‑compact

      - name: Commit & push svg files
        run: |
          git config user.name "github‑actions[bot]"
          git config user.email "github‑actions[bot]@users.noreply.github.com"
          git add ./.github/generated
          git commit -m "🤖 auto update profile stats" || echo "No changes to commit"
          git push
